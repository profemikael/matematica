<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Material Adaptado 00 · Piloto · Reta Numérica e Mercadinho</title>
<style>
/* Layout: uma coluna, uma página por vez (reta para a frente, reta para trás, mercadinho) */
:root{
  --azul:#1F4E79; --azul-claro:#E6EEF6; --fundo:#F7F9FC; --texto:#1b2430;
  --verde:#2E8B3E; --verde-claro:#DDF3E0; --vermelho:#C0392B; --vermelho-claro:#FBE3E0;
  --amarelo:#F4B400; --amarelo-claro:#FFF6D6; --borda:#C9D6E3; --branco:#ffffff;
  --fonte:"Times New Roman", Times, serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fundo);color:var(--texto);font-family:var(--fonte);font-size:20px;line-height:1.35;
  padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));padding-bottom:40px}
[hidden]{display:none!important}
.topo{background:var(--azul);color:var(--branco);margin:0 calc(-1 * max(12px, env(safe-area-inset-left,0px)));padding:14px 16px;text-align:center}
.topo h1{margin:0;font-size:1.35rem;text-wrap:balance}
.topo .aluno{font-size:.85rem;opacity:.9;margin-top:2px}
main{max-width:760px;margin:0 auto}

/* tela inicial */
.inicio{background:var(--branco);border:2px solid var(--borda);border-radius:12px;padding:20px;margin-top:20px;display:grid;gap:14px}
.inicio label{font-weight:bold;display:grid;gap:6px}
.inicio select,.inicio input{font-family:var(--fonte);font-size:1.1rem;padding:10px;border:2px solid var(--borda);border-radius:8px;width:100%;background:var(--branco);color:var(--texto)}
.btn{font-family:var(--fonte);font-size:1.15rem;font-weight:bold;padding:14px 20px;border:none;border-radius:10px;background:var(--azul);color:var(--branco);cursor:pointer}
.btn:disabled{background:#9aa8b6;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}

/* cabeçalho da página */
.cab{position:sticky;top:0;z-index:5;background:var(--fundo);padding:10px 0 8px;border-bottom:2px solid var(--borda)}
.cab h2{margin:0;color:var(--azul);font-size:1.3rem}
.cab p{margin:2px 0 8px;font-size:.95rem}
.barra{height:14px;background:var(--azul-claro);border-radius:7px;overflow:hidden}
.barra div{height:100%;width:0;background:var(--verde);transition:width .3s}
.cont{font-size:.9rem;margin-top:4px;text-align:right}

/* itens */
.lista{display:grid;gap:12px;margin-top:14px}
.item{background:var(--branco);border:2px solid var(--borda);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;opacity:.45}
.item.ativo{opacity:1;border-color:var(--amarelo);background:var(--amarelo-claro);box-shadow:0 0 0 3px rgba(244,180,0,.25)}
.item.feito{opacity:1;border-color:var(--verde);background:var(--verde-claro)}
.num{min-width:30px;height:30px;border-radius:50%;background:var(--azul);color:var(--branco);display:grid;place-items:center;font-size:.85rem;font-weight:bold}
.feito .num{background:var(--verde)}
.conta{font-size:2rem;font-weight:bold;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.caixa{min-width:78px;height:62px;border:3px solid var(--azul);border-radius:10px;background:var(--branco);display:inline-grid;place-items:center;font-size:2rem;font-weight:bold;padding:0 8px;cursor:pointer}
.ativo .caixa{border-color:var(--amarelo)}
.feito .caixa{border-color:var(--verde);color:var(--verde)}
.caixa.erro{border-color:var(--vermelho)!important;background:var(--vermelho-claro);color:var(--vermelho);animation:treme .35s}
@keyframes treme{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ok{font-size:1.6rem;color:var(--verde);font-weight:bold}

/* figuras */
.fig{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grupo{display:flex;flex-wrap:wrap;gap:2px;max-width:220px;font-size:1.7rem;line-height:1.1;padding:6px 8px;border:2px dashed var(--borda);border-radius:10px;background:var(--branco)}
.sinal{font-size:2rem;font-weight:bold;color:var(--azul)}
.riscado{position:relative;opacity:.5}
.riscado::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:3px;background:var(--vermelho);transform:rotate(-35deg)}

/* conta armada */
.armada{font-size:2.1rem;font-weight:bold;font-variant-numeric:tabular-nums;display:grid;grid-template-columns:auto auto;column-gap:8px;justify-items:end;align-items:center}
.armada .op{color:var(--azul)}
.armada .linha{grid-column:1/3;width:100%;border-top:3px solid var(--texto);margin:2px 0 6px}
.armada .caixa{grid-column:2}

/* historinha */
.hist{display:grid;gap:10px;flex:1 1 280px;min-width:0}
.hist p{margin:0;font-size:1.15rem}
.resp{display:flex;align-items:center;gap:10px;font-weight:bold;flex-wrap:wrap}

/* reta numérica */
.retaw{overflow-x:auto;width:100%;padding-bottom:4px}
.reta{display:flex;gap:3px;min-width:max-content}
.cel{width:30px;height:36px;display:grid;place-items:center;border:2px solid var(--borda);border-radius:6px;font-size:1rem;background:var(--branco);font-variant-numeric:tabular-nums}
.cel.ini{background:var(--amarelo);border-color:var(--amarelo);font-weight:bold}
.cel.passo{background:var(--verde-claro);border-color:var(--verde)}
.cel.fim{background:var(--verde);border-color:var(--verde);color:var(--branco);font-weight:bold}

/* mercadinho */
.prods{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prod{display:grid;justify-items:center;padding:8px 12px;border:2px solid var(--borda);border-radius:10px;background:var(--branco);min-width:92px}
.prod .e{font-size:2rem;line-height:1.1}
.prod b{font-size:1rem}
.prod span{font-size:1.05rem;color:var(--azul);font-weight:bold}
.nota{font-size:1.15rem;font-weight:bold;padding:8px 12px;border:2px solid var(--verde);border-radius:8px;background:var(--verde-claro)}

/* aviso */
.dica{margin-top:6px;font-size:1rem;font-weight:bold;color:var(--azul);min-height:1.3em}
.dica.erro{color:var(--vermelho)}
.dica.ok2{color:var(--verde)}
#entrada{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}

.proxima{margin:18px 0;display:grid}
.parabens{background:var(--branco);border:3px solid var(--verde);border-radius:14px;padding:24px;margin-top:20px;text-align:center}
.parabens h2{color:var(--verde);font-size:1.8rem;margin:0 0 8px}
.festa{font-size:3rem}
@media (max-width:480px){
  body{font-size:18px}
  .conta,.armada{font-size:1.7rem}
  .caixa{min-width:66px;height:54px;font-size:1.7rem}
  .grupo{font-size:1.45rem;max-width:170px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topo">
  <h1>Material Adaptado 00 · Piloto · Reta numérica e mercadinho</h1>
  <div class="aluno" id="aluno"></div>
</header>

<main>
  <!-- TELA INICIAL -->
  <section class="inicio" id="telaInicio">
    <p style="margin:0">Escolha seu nome e sua turma. Depois é só digitar a resposta de cada conta. Se estiver certa, a caixinha fica verde e passa para a próxima.</p>
    <label>Seu nome
      <select id="selNome"></select>
    </label>
    <label id="lblLivre" hidden>Escreva seu nome
      <input id="nomeLivre" type="text" autocomplete="off">
    </label>
    <label>Turma
      <select id="selTurma"><option value="">Escolha a turma</option></select>
    </label>
    <button class="btn" id="btnComecar" disabled>Começar</button>
  </section>

  <!-- PÁGINA DE ATIVIDADE -->
  <section id="telaAtiv" hidden>
    <div class="cab">
      <h2 id="pTitulo"></h2>
      <p id="pInstr"></p>
      <div class="barra"><div id="pBarra"></div></div>
      <div class="cont" id="pCont"></div>
      <div class="dica" id="dica"></div>
    </div>
    <div class="lista" id="lista"></div>
    <div class="proxima"><button class="btn" id="btnProx" disabled>Próxima página</button></div>
  </section>

  <!-- FINAL -->
  <section class="parabens" id="telaFim" hidden>
    <div class="festa">🎉🏆🎉</div>
    <h2>Parabéns!</h2>
    <p id="fimTexto"></p>
    <p id="fimEnvio" style="font-size:.95rem"></p>
    <button class="btn" id="btnDeNovo">Fazer de novo com outras contas</button>
  </section>
</main>

<input id="entrada" type="text" inputmode="numeric" autocomplete="off" aria-hidden="true" tabindex="-1">

<script>
/* ===== Envio do resultado (Google Form único das atividades) ===== */
const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSd0cya9DeEyUh4d1lMecTy3W5P5zJR-uEUeYryzR0U8wyIyTw/formResponse";
const CAMPOS = {nome:"entry.92939802", turma:"entry.1767871945", atividade:"entry.495326704", resultado:"entry.664553886"};
const ATIVIDADE = "Material Adaptado 00 - Piloto - Reta numérica e mercadinho";

const TURMAS = {
  "Matemática": ["6A MAT","6B MAT","7A MAT","8A MAT","8B MAT"],
  "Ciências": ["6B CIE","8B CEARA"]
};
const NOMES = ["Anderson Cauã Courino da Silva","Andria Carolaine Arques Aires","Derik dos Santos de Oliveira","Kauã Richard do Nascimento Ramiro","Leonardo Espindola Rodrigues","Lucas Henrique Mello Rodrigues"];
const LIVRE = "__livre__";

/* ===== Utilidades ===== */
const $ = id => document.getElementById(id);
const r = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pega = arr => arr[r(0,arr.length-1)];

function grupo(n, emoji, riscar=0){
  let s = "";
  for(let i=0;i<n;i++) s += `<span class="${i >= n-riscar ? "riscado" : ""}">${emoji}</span>`;
  return `<div class="grupo" aria-label="${n} figuras">${s}</div>`;
}
const caixa = () => `<span class="caixa" role="textbox" aria-label="resposta"></span>`;

/* ===== Geradores (valores novos a cada rodada) ===== */
function desenhaReta(ini,max){
  let c=""; for(let i=0;i<=max;i++) c+=`<span class="cel${i===ini?" ini":""}" data-n="${i}">${i}</span>`;
  return `<div class="retaw"><div class="reta">${c}</div></div>`;
}
function retaFrente(){
  const ini=r(0,12), p=r(2,Math.min(8,20-ini));
  return {resp:ini+p, caminho:[ini,ini+p], html:`<div class="hist"><p>Comece no <b>${ini}</b> e ande <b>${p}</b> casas para a frente. Em que número você parou?</p>${desenhaReta(ini,20)}<div class="conta">${ini} + ${p} = ${caixa()}</div></div>`};
}
function retaTras(){
  const ini=r(6,20), p=r(2,Math.min(8,ini));
  return {resp:ini-p, caminho:[ini,ini-p], html:`<div class="hist"><p>Comece no <b>${ini}</b> e volte <b>${p}</b> casas. Em que número você parou?</p>${desenhaReta(ini,20)}<div class="conta">${ini} − ${p} = ${caixa()}</div></div>`};
}
function unicos(fn,n){ const vistos=new Set(), out=[]; let t=0;
  while(out.length<n && t<500){ const it=fn(); t++; const k=it.html; if(vistos.has(k)) continue; vistos.add(k); out.push(it);} return out; }

const PRODUTOS=[["🍞","Pão"],["🥛","Leite"],["🍎","Maçã"],["🍌","Banana"],["🧃","Suco"],["🍫","Chocolate"],["🍪","Biscoito"],["🍦","Sorvete"],["🧀","Queijo"],["🥚","Ovos"]];
const prod=(p)=>`<div class="prod"><span class="e">${p[0]}</span><b>${p[1]}</b><span>${p[2]} reais</span></div>`;
function mercadinho(){
  const lista=embaralha(PRODUTOS.slice()).map(p=>[p[0],p[1],r(1,9)]);
  const out=[]; let k=0;
  for(let i=0;i<5;i++){ const x=lista[k++], y=lista[k++%lista.length];
    out.push({resp:x[2]+y[2], html:`<div class="hist"><p>Você comprou <b>${x[1].toLowerCase()}</b> e <b>${y[1].toLowerCase()}</b>. Quanto você vai pagar?</p><div class="prods">${prod(x)}<span class="sinal">+</span>${prod(y)}</div><div class="resp">Vou pagar ${caixa()} reais</div></div>`});
  }
  const lista2=embaralha(lista.slice());
  for(let i=0;i<5;i++){ const x=lista2[i], tenho=i<3?10:20;
    out.push({resp:tenho-x[2], html:`<div class="hist"><p>Você tem <b>${tenho} reais</b> e comprou <b>${x[1].toLowerCase()}</b>. Quanto sobra de troco?</p><div class="prods"><span class="nota">💵 ${tenho} reais</span><span class="sinal">−</span>${prod(x)}</div><div class="resp">Sobram ${caixa()} reais</div></div>`});
  }
  // intercala: compra, troco, compra, troco...
  const res=[]; for(let i=0;i<5;i++){ res.push(out[i]); res.push(out[i+5]); } return res;
}
function embaralha(a){ for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }

const PAGINAS = [
  {titulo:"Página 1 · Pulando para a frente", instr:"Na conta de mais a gente anda para a frente na reta. Comece no número amarelo e conte os pulos.",
   gerar:()=>unicos(retaFrente,15)},
  {titulo:"Página 2 · Voltando na reta", instr:"Na conta de menos a gente volta na reta. Comece no número amarelo e conte para trás.",
   gerar:()=>unicos(retaTras,15)},
  {titulo:"Página 3 · Mercadinho", instr:"Olhe o preço de cada coisa. Some para saber quanto pagar e diminua para saber o troco.",
   gerar:mercadinho}
];

/* ===== Estado ===== */
let est = {nome:"", turma:"", pag:0, itens:[], atual:0, buf:"", erros:0, total:0, travado:false};

/* ===== Tela inicial ===== */
(function montaTurmas(){
  const sel=$("selTurma");
  for(const [disc,lista] of Object.entries(TURMAS)){
    const g=document.createElement("optgroup"); g.label=disc;
    lista.forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;g.appendChild(o);});
    sel.appendChild(g);
  }
})();
function validaInicio(){
  const t=$("selTurma").value, n=$("selNome").value, livre=$("nomeLivre").value.trim();
  const ok = t && ((n && n!==LIVRE) || (n===LIVRE && livre.length>=2));
  $("btnComecar").disabled=!ok;
}
(function montaNomes(){
  const s=$("selNome"); s.innerHTML='<option value="">Escolha seu nome</option>';
  const o=document.createElement("option");o.value=LIVRE;o.textContent="MEU NOME NÃO ESTÁ NA LISTA";s.appendChild(o);
  NOMES.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;s.appendChild(o);});
})();
$("selTurma").addEventListener("change",validaInicio);
$("selNome").addEventListener("change",()=>{ $("lblLivre").hidden=$("selNome").value!==LIVRE; validaInicio(); });
$("nomeLivre").addEventListener("input",validaInicio);
$("btnComecar").addEventListener("click",()=>{
  est.turma=$("selTurma").value;
  est.nome=$("selNome").value===LIVRE ? $("nomeLivre").value.trim() : $("selNome").value;
  $("aluno").textContent=`${est.nome} · ${est.turma}`;
  $("telaInicio").hidden=true; abrePagina(0);
});

/* ===== Página ===== */
function abrePagina(p){
  est.pag=p; est.itens=PAGINAS[p].gerar(); est.atual=0; est.buf="";
  $("pTitulo").textContent=PAGINAS[p].titulo; $("pInstr").textContent=PAGINAS[p].instr;
  $("lista").innerHTML = est.itens.map((it,i)=>`<div class="item" id="it${i}"><span class="num">${i+1}</span>${it.html}<span class="ok" hidden>✔</span></div>`).join("");
  est.itens.forEach((it,i)=>{ it.el=$("it"+i); it.box=it.el.querySelector(".caixa"); it.resp=String(it.resp); });
  $("btnProx").disabled=true;
  $("btnProx").hidden = p===PAGINAS.length-1;
  $("telaAtiv").hidden=false; $("telaFim").hidden=true;
  ativa(0); window.scrollTo({top:0});
}
function ativa(i){
  est.itens.forEach((it,k)=>it.el.classList.toggle("ativo",k===i));
  atualizaBarra();
  if(i<est.itens.length){
    dica("Digite a resposta da conta "+(i+1)+" no teclado.");
    const el=est.itens[i].el, rect=el.getBoundingClientRect();
    if(rect.top<120 || rect.bottom>window.innerHeight-20) el.scrollIntoView({behavior:"smooth",block:"center"});
  }
}
function atualizaBarra(){
  const n=est.itens.length, f=est.atual;
  $("pBarra").style.width=(f/n*100)+"%"; $("pCont").textContent=`${f} de ${n} certas`;
}
function digita(d){
  if(est.travado || $("telaAtiv").hidden) return;
  const it=est.itens[est.atual]; if(!it) return;
  if(d==="x"){ est.buf=est.buf.slice(0,-1); it.box.textContent=est.buf; return; }
  if(est.buf.length>=3) return;
  est.buf+=d; it.box.textContent=est.buf;
  if(est.buf.length>=it.resp.length) confere(it);
}
function confere(it){
  if(est.buf===it.resp){
    it.el.classList.remove("ativo"); it.el.classList.add("feito"); it.el.querySelector(".ok").hidden=false;
    if(it.caminho){ const [a,b]=it.caminho, lo=Math.min(a,b), hi=Math.max(a,b);
      it.el.querySelectorAll(".cel").forEach(c=>{ const n=+c.dataset.n; if(n===b) c.classList.add("fim"); else if(n>lo&&n<hi) c.classList.add("passo"); }); }
    est.buf=""; est.atual++; est.total++;
    if(est.atual>=est.itens.length){ atualizaBarra(); fimPagina(); } else ativa(est.atual);
  } else {
    est.erros++; est.travado=true; it.box.classList.add("erro");
    dica("Ainda não. Conte de novo com calma e tente outra vez!","erro");
    setTimeout(()=>{ it.box.classList.remove("erro"); it.box.textContent=""; est.buf=""; est.travado=false; },700);
  }
}
function fimPagina(){
  if(est.pag<PAGINAS.length-1){
    dica("Muito bem! Página completa. Clique em Próxima página.","ok2");
    $("btnProx").disabled=false;
    $("btnProx").scrollIntoView({behavior:"smooth",block:"center"});
  } else {
    dica("Muito bem! Você fez tudo!","ok2");
    setTimeout(terminar,900);
  }
}
$("btnProx").addEventListener("click",()=>{
  if(est.pag<PAGINAS.length-1) abrePagina(est.pag+1); else terminar();
});
function terminar(){
  $("telaAtiv").hidden=true; $("telaFim").hidden=false;
  $("fimTexto").textContent=`${est.nome}, você acertou todas as ${est.total} contas das 3 páginas!`;
  window.scrollTo({top:0});
  const resultado=`Completou as 3 páginas (${est.total} contas) · ${est.erros} tentativa(s) errada(s)`;
  $("fimEnvio").textContent="Enviando para o professor...";
  const dados=new URLSearchParams();
  dados.append(CAMPOS.nome,est.nome); dados.append(CAMPOS.turma,est.turma);
  dados.append(CAMPOS.atividade,ATIVIDADE); dados.append(CAMPOS.resultado,resultado);
  fetch(FORM,{method:"POST",mode:"no-cors",body:dados})
    .then(()=>{$("fimEnvio").textContent="Resultado enviado para o professor. ✔";})
    .catch(()=>{$("fimEnvio").textContent="Não deu para enviar agora. Mostre esta tela para o professor.";});
}
$("btnDeNovo").addEventListener("click",()=>{ est.erros=0; est.total=0; abrePagina(0); });

/* ===== Teclado ===== */
function dica(t,c=""){ const d=$("dica"); d.textContent=t; d.className="dica "+c; }
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||(e.target.tagName==="INPUT"&&e.target.id!=="entrada")) return;
  if(/^[0-9]$/.test(e.key)){ digita(e.key); e.preventDefault(); }
  else if(e.key==="Backspace"){ digita("x"); e.preventDefault(); }
});
/* no celular: tocar na caixinha abre o teclado numérico do aparelho */
$("lista").addEventListener("click",e=>{ if(e.target.closest(".ativo")){ const i=$("entrada"); i.value=""; i.focus({preventScroll:true}); } });
$("entrada").addEventListener("input",e=>{ const v=e.target.value.replace(/\D/g,""); e.target.value=""; for(const d of v) digita(d); });
</script>
</body>
</html>
