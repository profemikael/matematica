<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Continhas de Mais e de Menos</title>
<style>
/* Layout: uma coluna, uma página por vez (adição, subtração, historinhas), teclado numérico grande fixo embaixo */
:root{
  --azul:#1F4E79; --azul-claro:#E6EEF6; --fundo:#F7F9FC; --texto:#1b2430;
  --verde:#2E8B3E; --verde-claro:#DDF3E0; --vermelho:#C0392B; --vermelho-claro:#FBE3E0;
  --amarelo:#F4B400; --amarelo-claro:#FFF6D6; --borda:#C9D6E3; --branco:#ffffff;
  --fonte:"Times New Roman", Times, serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fundo);color:var(--texto);font-family:var(--fonte);font-size:20px;line-height:1.35;
  padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));padding-bottom:230px}
[hidden]{display:none!important}
.topo{background:var(--azul);color:var(--branco);margin:0 calc(-1 * max(12px, env(safe-area-inset-left,0px)));padding:14px 16px;text-align:center}
.topo h1{margin:0;font-size:1.35rem;text-wrap:balance}
.topo .aluno{font-size:.85rem;opacity:.9;margin-top:2px}
main{max-width:760px;margin:0 auto}

/* tela inicial */
.inicio{background:var(--branco);border:2px solid var(--borda);border-radius:12px;padding:20px;margin-top:20px;display:grid;gap:14px}
.inicio label{font-weight:bold;display:grid;gap:6px}
.inicio select,.inicio input{font-family:var(--fonte);font-size:1.1rem;padding:10px;border:2px solid var(--borda);border-radius:8px;width:100%;background:var(--branco);color:var(--texto)}
.btn{font-family:var(--fonte);font-size:1.15rem;font-weight:bold;padding:14px 20px;border:none;border-radius:10px;background:var(--azul);color:var(--branco);cursor:pointer}
.btn:disabled{background:#9aa8b6;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}

/* cabeçalho da página */
.cab{position:sticky;top:0;z-index:5;background:var(--fundo);padding:10px 0 8px;border-bottom:2px solid var(--borda)}
.cab h2{margin:0;color:var(--azul);font-size:1.3rem}
.cab p{margin:2px 0 8px;font-size:.95rem}
.barra{height:14px;background:var(--azul-claro);border-radius:7px;overflow:hidden}
.barra div{height:100%;width:0;background:var(--verde);transition:width .3s}
.cont{font-size:.9rem;margin-top:4px;text-align:right}

/* itens */
.lista{display:grid;gap:12px;margin-top:14px}
.item{background:var(--branco);border:2px solid var(--borda);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;opacity:.45}
.item.ativo{opacity:1;border-color:var(--amarelo);background:var(--amarelo-claro);box-shadow:0 0 0 3px rgba(244,180,0,.25)}
.item.feito{opacity:1;border-color:var(--verde);background:var(--verde-claro)}
.num{min-width:30px;height:30px;border-radius:50%;background:var(--azul);color:var(--branco);display:grid;place-items:center;font-size:.85rem;font-weight:bold}
.feito .num{background:var(--verde)}
.conta{font-size:2rem;font-weight:bold;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.caixa{min-width:78px;height:62px;border:3px solid var(--azul);border-radius:10px;background:var(--branco);display:inline-grid;place-items:center;font-size:2rem;font-weight:bold;padding:0 8px;cursor:pointer}
.ativo .caixa{border-color:var(--amarelo)}
.feito .caixa{border-color:var(--verde);color:var(--verde)}
.caixa.erro{border-color:var(--vermelho)!important;background:var(--vermelho-claro);color:var(--vermelho);animation:treme .35s}
@keyframes treme{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ok{font-size:1.6rem;color:var(--verde);font-weight:bold}

/* figuras */
.fig{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grupo{display:flex;flex-wrap:wrap;gap:2px;max-width:220px;font-size:1.7rem;line-height:1.1;padding:6px 8px;border:2px dashed var(--borda);border-radius:10px;background:var(--branco)}
.sinal{font-size:2rem;font-weight:bold;color:var(--azul)}
.riscado{position:relative;opacity:.5}
.riscado::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:3px;background:var(--vermelho);transform:rotate(-35deg)}

/* conta armada */
.armada{font-size:2.1rem;font-weight:bold;font-variant-numeric:tabular-nums;display:grid;grid-template-columns:auto auto;column-gap:8px;justify-items:end;align-items:center}
.armada .op{color:var(--azul)}
.armada .linha{grid-column:1/3;width:100%;border-top:3px solid var(--texto);margin:2px 0 6px}
.armada .caixa{grid-column:2}

/* historinha */
.hist{display:grid;gap:10px;width:100%}
.hist p{margin:0;font-size:1.15rem}
.resp{display:flex;align-items:center;gap:10px;font-weight:bold;flex-wrap:wrap}

/* teclado */
.teclado{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--azul);
  padding:10px max(12px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px))}
.teclado .grade{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tecla{font-family:var(--fonte);font-size:1.7rem;font-weight:bold;height:58px;border:none;border-radius:10px;background:var(--branco);color:var(--azul);cursor:pointer;touch-action:manipulation}
.tecla:active{transform:scale(.95);background:var(--amarelo-claro)}
.tecla.apaga{background:var(--amarelo);color:var(--texto);font-size:1.2rem}
.dica{max-width:520px;margin:0 auto 6px;color:var(--branco);font-size:.9rem;text-align:center;min-height:1.2em}

.proxima{margin:18px 0;display:grid}
.parabens{background:var(--branco);border:3px solid var(--verde);border-radius:14px;padding:24px;margin-top:20px;text-align:center}
.parabens h2{color:var(--verde);font-size:1.8rem;margin:0 0 8px}
.festa{font-size:3rem}
@media (max-width:480px){
  body{font-size:18px;padding-bottom:210px}
  .conta,.armada{font-size:1.7rem}
  .caixa{min-width:66px;height:54px;font-size:1.7rem}
  .grupo{font-size:1.45rem;max-width:170px}
  .tecla{height:52px;font-size:1.5rem}
  .teclado .grade{grid-template-columns:repeat(6,1fr);gap:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topo">
  <h1>Continhas de mais e de menos</h1>
  <div class="aluno" id="aluno"></div>
</header>

<main>
  <!-- TELA INICIAL -->
  <section class="inicio" id="telaInicio">
    <p style="margin:0">Escolha sua turma e seu nome. Depois é só digitar a resposta de cada continha. Se estiver certa, a caixinha fica verde e passa para a próxima.</p>
    <label>Turma
      <select id="selTurma"><option value="">Escolha a turma</option></select>
    </label>
    <label id="lblNome" hidden>Seu nome
      <select id="selNome"></select>
    </label>
    <label id="lblLivre" hidden>Escreva seu nome
      <input id="nomeLivre" type="text" autocomplete="off">
    </label>
    <button class="btn" id="btnComecar" disabled>Começar</button>
  </section>

  <!-- PÁGINA DE ATIVIDADE -->
  <section id="telaAtiv" hidden>
    <div class="cab">
      <h2 id="pTitulo"></h2>
      <p id="pInstr"></p>
      <div class="barra"><div id="pBarra"></div></div>
      <div class="cont" id="pCont"></div>
    </div>
    <div class="lista" id="lista"></div>
    <div class="proxima"><button class="btn" id="btnProx" disabled>Próxima página</button></div>
  </section>

  <!-- FINAL -->
  <section class="parabens" id="telaFim" hidden>
    <div class="festa">🎉🏆🎉</div>
    <h2>Parabéns!</h2>
    <p id="fimTexto"></p>
    <p id="fimEnvio" style="font-size:.95rem"></p>
    <button class="btn" id="btnDeNovo">Fazer de novo com outras continhas</button>
  </section>
</main>

<div class="teclado" id="teclado" hidden>
  <div class="dica" id="dica"></div>
  <div class="grade">
    <button class="tecla" data-d="1">1</button><button class="tecla" data-d="2">2</button><button class="tecla" data-d="3">3</button>
    <button class="tecla" data-d="4">4</button><button class="tecla" data-d="5">5</button><button class="tecla" data-d="6">6</button>
    <button class="tecla" data-d="7">7</button><button class="tecla" data-d="8">8</button><button class="tecla" data-d="9">9</button>
    <button class="tecla" data-d="0">0</button><button class="tecla apaga" data-d="x" style="grid-column:span 2">⌫ Apagar</button>
  </div>
</div>

<script>
/* ===== Envio do resultado (Google Form único das atividades) ===== */
const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSd0cya9DeEyUh4d1lMecTy3W5P5zJR-uEUeYryzR0U8wyIyTw/formResponse";
const CAMPOS = {nome:"entry.92939802", turma:"entry.1767871945", atividade:"entry.495326704", resultado:"entry.664553886"};
const ATIVIDADE = "Continhas de mais e de menos (adaptação)";

const TURMAS = {
  "Matemática": ["6A MAT","6B MAT","7A MAT","8A MAT","8B MAT"],
  "Ciências": ["6B CIE","8B CEARA"]
};
const NOMES = {
  "6B": ["Anderson Cauã Courino da Silva","Arthur Daniel Pedralli Marcos","Bryan Carvalho Vicente","Carlos Eduardo da Rosa de Freitas","Cauã Machado Alberto","Davi Rafael Paz Varisa","Enderlis Camila Rodriguez Lisboa","Gabriel de Oliveira Martins","Giovanna Silva de Freitas Nunes","José Lucas Varela","Kalebe Cardoso Issler","Kassiane Godoi Pereira","Kauã Richard do Nascimento Ramiro","Mariana Pacheco da Silva","Matheus Dias","Naiara Rodrigues Mendes Amaro","Nathanael Gonçalves Almeida","Nerysmar de los Angeles Salazar Suarez","Nícollas da Silva Boneto","Pedro Enrique Assis de Freitas Freitas","Stella de Oliveira Pereira","Valentina da Silva Barboza","Victor Burgdurff de Souza","Ysadora de Oliveira Gawlinski Costa","Fagner Severo Mariano","Gabriel Henrique Severo Soares","Yuri de Lima Trindade","Peterson Luan Gomes Penha","Eduardo Henrique Freire Pires","Manuella Belleboni Vargas","Isabella Trindade Carvalho"],
  "7A": ["Ana Clara Martins Mielezarski","Ana Lauren dos Santos Lombardo","Antônio Oliveira C. de Medeiros","Bernardo Matheus Marques","Davi Lucas Dalaroza Medeiros","Eduarda Specht Martins","Eduardo Nunes Ramos","Guilherme Vicennti Vargas da Silva","Gustavo Accinelli Teixeira","Isabelli da Silva de Araújo","Isabelly de Souza Dullius","João Victor Ibias dos Santos","Leonardo Scholl Feldmann","Lorenzo Vidal Berwanger","Luan de Oliveira Picáz","Luis Otavio Borges Marx","Maiele Rohde Rodrigues","Maria Luiza Oliveira Machado","Millena Bitencourt de O. Alves","Murilo Nunes Souza","Murilo Vianna dos Santos","Naomi Magnolia de Limas Maier","Nicolas Umbersbach Coelho","Rafael Narcizo das Neves da Silva","Samuel Rossano","Shadia Fahed Azevedo Hamad","Sofia Stumpf Santana","Valentina Marques Duzac","Davi Machado Lemos Larcen","Antônia Vaz Rybarczik"],
  "8B": ["Alessandro Freitas Medeiros Filho","Alice dos Santos Hofmam","Alice Manuela Goulart","Antônio Flores Appel","Arthur Salton","Brenda Sofia Rocha Fernandes","Eduardo Rodrigues Braga","Felipe Gabriel Flores dos Santos","Giovanna Silva Dorneles","Isaias Weber Dias","Jonnas de Araújo Fassini","Kevin Pereira de Andrade","Leonardo Bião Weissheimer","Maria Eduarda Antonelo de Paula","Matheus dos Santos Bernardes","Pedro Magalhães Cimirro","Rodrigo de Paula Borges","Letícia Eifler da Costa","Ethyel Richerd Sosa Fraga","Arthur Villar Reis","Alexandre dos Santos Garcia","Athyla Samuel Silveira de Oliveira","Pedro Henrique Nascente de Souza"]
};
const LIVRE = "__livre__";

/* ===== Utilidades ===== */
const $ = id => document.getElementById(id);
const r = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pega = arr => arr[r(0,arr.length-1)];
const FIGS = ["🍎","⭐","🎈","🐟","🌸","⚽","🍪","🚗","🐞","🍓"];

function grupo(n, emoji, riscar=0){
  let s = "";
  for(let i=0;i<n;i++) s += `<span class="${i >= n-riscar ? "riscado" : ""}">${emoji}</span>`;
  return `<div class="grupo" aria-label="${n} figuras">${s}</div>`;
}
const caixa = () => `<span class="caixa" role="textbox" aria-label="resposta"></span>`;

/* ===== Geradores (valores novos a cada rodada) ===== */
function figSoma(){ const a=r(1,5), b=r(1,5), e=pega(FIGS);
  return {resp:a+b, html:`<div class="fig">${grupo(a,e)}<span class="sinal">+</span>${grupo(b,e)}<span class="sinal">=</span>${caixa()}</div>`}; }
function figSub(){ const a=r(4,9), b=r(1,a-1), e=pega(FIGS);
  return {resp:a-b, html:`<div class="fig">${grupo(a,e,b)}<span class="sinal">${a} − ${b} =</span>${caixa()}</div>`}; }
const linha = (a,op,b) => ({resp: op==="+"?a+b:a-b, html:`<div class="conta">${a} ${op==="+"?"+":"−"} ${b} = ${caixa()}</div>`});
function armada(a,op,b){
  return {resp: op==="+"?a+b:a-b, html:`<div class="armada"><span></span><span>${a}</span><span class="op">${op==="+"?"+":"−"}</span><span>${b}</span><div class="linha"></div>${caixa()}</div>`};
}
function somaDezenas(){ let a1=r(1,7),a0=r(0,6); let b1=r(1,9-a1),b0=r(0,9-a0); return armada(a1*10+a0,"+",b1*10+b0); }
function subDezenas(){ let a1=r(3,9),a0=r(3,9); let b1=r(1,a1-1),b0=r(0,a0); return armada(a1*10+a0,"−".replace("−","-"),b1*10+b0); }

function unicos(fn, n){ const vistos=new Set(), out=[]; let t=0;
  while(out.length<n && t<500){ const it=fn(); t++; const k=it.html.replace(/<[^>]+>/g,"")+it.resp+(it.html.match(/grupo/g)||[]).length+it.html.length; if(vistos.has(k)) continue; vistos.add(k); out.push(it);} return out; }

/* Historinhas: [texto, emoji, operação, unidade, minA, maxA, minB, maxB] */
const NOMES_H = ["Ana","Pedro","Lia","João","Bia","Davi","Malu","Theo"];
const HIST = [
  ["{n} tinha {a} figurinhas e ganhou mais {b} do primo. Quantas figurinhas {n} tem agora?","⭐","+","figurinhas",2,6,1,4],
  ["Na fruteira tinha {a} bananas. A família comeu {b}. Quantas bananas sobraram?","🍌","-","bananas",5,9,1,4],
  ["{n} comprou {a} balões para a festa, mas {b} estouraram. Quantos balões ficaram?","🎈","-","balões",5,9,1,4],
  ["A galinha botou {a} ovos de manhã e {b} ovos de tarde. Quantos ovos ela botou no dia?","🥚","+","ovos",2,6,1,5],
  ["Tinha {a} passarinhos na árvore. {b} voaram embora. Quantos passarinhos ficaram na árvore?","🐦","-","passarinhos",5,9,1,4],
  ["{n} tinha {a} lápis no estojo e a professora deu mais {b}. Quantos lápis ficaram no estojo?","✏️","+","lápis",2,6,1,4],
  ["No aquário havia {a} peixinhos. {n} deu {b} para o vizinho. Quantos peixinhos ficaram?","🐟","-","peixinhos",5,9,1,4],
  ["{n} fez {a} gols no primeiro jogo e {b} gols no segundo. Quantos gols fez ao todo?","⚽","+","gols",1,5,1,4],
  ["Na mesa havia {a} biscoitos. As crianças comeram {b}. Quantos biscoitos sobraram?","🍪","-","biscoitos",6,10,2,5],
  ["No estacionamento tinha {a} carros. Chegaram mais {b}. Quantos carros tem agora?","🚗","+","carros",3,6,2,4],
  ["Numa turma tem {a} meninos e {b} meninas. Quantos alunos tem a turma ao todo?","","+","alunos",10,14,10,15],
  ["{n} tinha {a} reais e gastou {b} reais no lanche. Com quantos reais {n} ficou?","","-","reais",20,40,5,15]
];
function historia(t){
  const [txt,e,op,un,a0,a1,b0,b1]=t; const a=r(a0,a1); const b=op==="+"?r(b0,b1):r(b0,Math.min(b1,a-1)); const n=pega(NOMES_H);
  const texto = txt.replaceAll("{n}",n).replaceAll("{a}",a).replaceAll("{b}",b);
  let desenho = "";
  if(e){ desenho = op==="+" ? `<div class="fig">${grupo(a,e)}<span class="sinal">+</span>${grupo(b,e)}</div>`
                             : `<div class="fig">${grupo(a,e,b)}</div>`; }
  return {resp: op==="+"?a+b:a-b, html:`<div class="hist"><p>${esc(texto)}</p>${desenho}<div class="resp">Resposta: ${caixa()} ${un}</div></div>`};
}
function embaralha(a){ for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }

const PAGINAS = [
  {titulo:"Página 1 · Continhas de mais", instr:"Conte as figuras e junte tudo. Digite o resultado.",
   gerar:()=>[...unicos(figSoma,5), ...unicos(()=>{const a=r(1,6);return linha(a,"+",r(1,10-a))},5),
              ...unicos(()=>linha(r(5,9),"+",r(3,9)),5), ...unicos(somaDezenas,5)]},
  {titulo:"Página 2 · Continhas de menos", instr:"As figuras riscadas foram embora. Conte as que sobraram.",
   gerar:()=>[...unicos(figSub,5), ...unicos(()=>{const a=r(3,10);return linha(a,"-",r(1,a-1))},5),
              ...unicos(()=>{const a=r(11,18);return linha(a,"-",r(a-9,9))},5), ...unicos(subDezenas,5)]},
  {titulo:"Página 3 · Historinhas", instr:"Leia a historinha com calma, olhe o desenho e descubra a resposta.",
   gerar:()=>embaralha(HIST.slice()).slice(0,10).map(historia)}
];

/* ===== Estado ===== */
let est = {nome:"", turma:"", pag:0, itens:[], atual:0, buf:"", erros:0, total:0, travado:false};

/* ===== Tela inicial ===== */
(function montaTurmas(){
  const sel=$("selTurma");
  for(const [disc,lista] of Object.entries(TURMAS)){
    const g=document.createElement("optgroup"); g.label=disc;
    lista.forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;g.appendChild(o);});
    sel.appendChild(g);
  }
})();
function validaInicio(){
  const t=$("selTurma").value, n=$("selNome").value, livre=$("nomeLivre").value.trim();
  const ok = t && ((n && n!==LIVRE) || (n===LIVRE && livre.length>=2));
  $("btnComecar").disabled=!ok;
}
$("selTurma").addEventListener("change",()=>{
  const t=$("selTurma").value, cod=t.split(" ")[0], lista=NOMES[cod]||[];
  const s=$("selNome"); s.innerHTML='<option value="">Escolha seu nome</option>';
  lista.slice().sort((a,b)=>a.localeCompare(b,"pt-BR")).forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;s.appendChild(o);});
  const o=document.createElement("option");o.value=LIVRE;o.textContent="Meu nome não está na lista";s.appendChild(o);
  $("lblNome").hidden=!t; $("lblLivre").hidden=true;
  if(t && lista.length===0){ s.value=LIVRE; $("lblLivre").hidden=false; }
  validaInicio();
});
$("selNome").addEventListener("change",()=>{ $("lblLivre").hidden=$("selNome").value!==LIVRE; validaInicio(); });
$("nomeLivre").addEventListener("input",validaInicio);
$("btnComecar").addEventListener("click",()=>{
  est.turma=$("selTurma").value;
  est.nome=$("selNome").value===LIVRE ? $("nomeLivre").value.trim() : $("selNome").value;
  $("aluno").textContent=`${est.nome} · ${est.turma}`;
  $("telaInicio").hidden=true; abrePagina(0);
});

/* ===== Página ===== */
function abrePagina(p){
  est.pag=p; est.itens=PAGINAS[p].gerar(); est.atual=0; est.buf="";
  $("pTitulo").textContent=PAGINAS[p].titulo; $("pInstr").textContent=PAGINAS[p].instr;
  $("lista").innerHTML = est.itens.map((it,i)=>`<div class="item" id="it${i}"><span class="num">${i+1}</span>${it.html}<span class="ok" hidden>✔</span></div>`).join("");
  est.itens.forEach((it,i)=>{ it.el=$("it"+i); it.box=it.el.querySelector(".caixa"); it.resp=String(it.resp); });
  $("btnProx").disabled=true;
  $("btnProx").textContent = p<PAGINAS.length-1 ? "Próxima página" : "Terminar";
  $("telaAtiv").hidden=false; $("teclado").hidden=false; $("telaFim").hidden=true;
  ativa(0); window.scrollTo({top:0});
}
function ativa(i){
  est.itens.forEach((it,k)=>it.el.classList.toggle("ativo",k===i));
  atualizaBarra();
  if(i<est.itens.length){
    $("dica").textContent="Digite a resposta da continha "+(i+1);
    const el=est.itens[i].el, rect=el.getBoundingClientRect();
    if(rect.top<120 || rect.bottom>window.innerHeight-230) el.scrollIntoView({behavior:"smooth",block:"center"});
  }
}
function atualizaBarra(){
  const n=est.itens.length, f=est.atual;
  $("pBarra").style.width=(f/n*100)+"%"; $("pCont").textContent=`${f} de ${n} certas`;
}
function digita(d){
  if(est.travado || $("telaAtiv").hidden) return;
  const it=est.itens[est.atual]; if(!it) return;
  if(d==="x"){ est.buf=est.buf.slice(0,-1); it.box.textContent=est.buf; return; }
  if(est.buf.length>=3) return;
  est.buf+=d; it.box.textContent=est.buf;
  if(est.buf.length>=it.resp.length) confere(it);
}
function confere(it){
  if(est.buf===it.resp){
    it.el.classList.remove("ativo"); it.el.classList.add("feito"); it.el.querySelector(".ok").hidden=false;
    est.buf=""; est.atual++; est.total++;
    if(est.atual>=est.itens.length){ atualizaBarra(); fimPagina(); } else ativa(est.atual);
  } else {
    est.erros++; est.travado=true; it.box.classList.add("erro");
    $("dica").textContent="Ainda não. Conte de novo com calma e tente outra vez!";
    setTimeout(()=>{ it.box.classList.remove("erro"); it.box.textContent=""; est.buf=""; est.travado=false; },700);
  }
}
function fimPagina(){
  $("dica").textContent = est.pag<PAGINAS.length-1 ? "Muito bem! Página completa. Toque em Próxima página." : "Muito bem! Você fez tudo. Toque em Terminar.";
  $("btnProx").disabled=false;
  $("btnProx").scrollIntoView({behavior:"smooth",block:"center"});
}
$("btnProx").addEventListener("click",()=>{
  if(est.pag<PAGINAS.length-1) abrePagina(est.pag+1); else terminar();
});
function terminar(){
  $("telaAtiv").hidden=true; $("teclado").hidden=true; $("telaFim").hidden=false;
  $("fimTexto").textContent=`${est.nome}, você acertou todas as ${est.total} continhas das 3 páginas!`;
  window.scrollTo({top:0});
  const resultado=`Completou as 3 páginas (${est.total} continhas) · ${est.erros} tentativa(s) errada(s)`;
  $("fimEnvio").textContent="Enviando para o professor...";
  const dados=new URLSearchParams();
  dados.append(CAMPOS.nome,est.nome); dados.append(CAMPOS.turma,est.turma);
  dados.append(CAMPOS.atividade,ATIVIDADE); dados.append(CAMPOS.resultado,resultado);
  fetch(FORM,{method:"POST",mode:"no-cors",body:dados})
    .then(()=>{$("fimEnvio").textContent="Resultado enviado para o professor. ✔";})
    .catch(()=>{$("fimEnvio").textContent="Não deu para enviar agora. Mostre esta tela para o professor.";});
}
$("btnDeNovo").addEventListener("click",()=>{ est.erros=0; est.total=0; abrePagina(0); });

/* ===== Teclado (na tela e físico) ===== */
document.querySelectorAll(".tecla").forEach(b=>b.addEventListener("click",()=>digita(b.dataset.d)));
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(/^[0-9]$/.test(e.key)){ digita(e.key); e.preventDefault(); }
  else if(e.key==="Backspace"){ digita("x"); e.preventDefault(); }
});
</script>
</body>
</html>
